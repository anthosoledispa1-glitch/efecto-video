<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flores amarillas 💛</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#02050d;
  font-family:Georgia,serif;
}

.scene{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  perspective:700px;
  background:
    radial-gradient(circle at center,
      rgba(255,211,93,.30) 0%,
      rgba(255,193,7,.08) 10%,
      rgba(3,10,25,0) 32%),
    #02050d;
}

/* Luz central */
.light{
  position:absolute;
  left:50%;
  top:50%;
  width:90px;
  height:90px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:#fff3bd;
  box-shadow:
    0 0 25px #ffe477,
    0 0 70px rgba(255,202,50,.8),
    0 0 150px rgba(255,174,30,.35);
  z-index:2;
}

/* Líneas de velocidad */
.speed{
  position:absolute;
  left:50%;
  top:50%;
  width:180%;
  height:180%;
  transform:translate(-50%,-50%);
  background:repeating-conic-gradient(
    from 0deg,
    transparent 0deg 3deg,
    rgba(255,255,255,.35) 3.3deg 3.8deg,
    transparent 4deg 8deg
  );
  mask-image:radial-gradient(circle,transparent 0 8%,black 30%,transparent 70%);
  animation:spin 18s linear infinite;
}

@keyframes spin{
  to{transform:translate(-50%,-50%) rotate(360deg);}
}

/* Elementos que viajan hacia el centro */
.item{
  position:absolute;
  left:50%;
  top:50%;
  transform:
    translate(-50%,-50%)
    rotate(var(--r))
    translateX(var(--distance))
    scale(.35);
  animation:travel var(--time) linear infinite;
  animation-delay:var(--delay);
  white-space:nowrap;
