<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flores para ti 💛</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
}

body {
  background: #111;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

.contenido {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

.flor {
  width: 100px;
  height: 100px;
  position: relative;
  animation: flotar 3s ease-in-out infinite;
}

.petalo {
  position: absolute;
  width: 45px;
  height: 65px;
  background: #ffd43b;
  border-radius: 50%;
  left: 27px;
  top: 17px;
  box-shadow: 0 0 20px #ffd43b;
}

.p1 {
  transform: rotate(0deg) translateY(-28px);
}

.p2 {
  transform: rotate(60deg) translateY(-28px);
}

.p3 {
  transform: rotate(120deg) translateY(-28px);
}

.p4 {
  transform: rotate(180deg) translateY(-28px);
}

.p5 {
  transform: rotate(240deg) translateY(-28px);
}

.p6 {
  transform: rotate(300deg) translateY(-28px);
}

.centro {
  position: absolute;
  width: 35px;
  height: 35px;
  background: #8b5a00;
  border-radius: 50%;
  left: 32px;
  top: 32px;
  z-index: 2;
}

h1 {
  color: white;
  font-size: 28px;
  text-align: center;
  margin-top: 30px;
  text-shadow: 0 0 15px #ffd43b;
}

p {
  color: #ffd43b;
  font-size: 18px;
}

@keyframes flotar {
  0%, 100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-15px);
  }
}
</style>
</head>

<body>

<div class="contenido">

  <div class="flor">
    <div class="petalo p1"></div>
    <div class="petalo p2"></div>
    <div class="petalo p3"></div>
    <div class="petalo p4"></div>
    <div class="petalo p5"></div>
    <div class="petalo p6"></div>
    <div class="centro"></div>
  </div>

  <h1>Flores para ti 💛</h1>

  <p>Gracias por existir ✨</p>

</div>

</body>
</html>
